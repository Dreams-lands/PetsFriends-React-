  # ==========================================================================
  # PAYMENTS - Cong thanh toan COD / VNPay / MoMo
  # ==========================================================================
  /payment-gateways:
    get:
      tags: [Payments]
      summary: Lay cau hinh cong thanh toan (khoa bi mat duoc che, Admin dung includeSecrets=true de xem day du)
      parameters:
        - in: query
          name: includeSecrets
          schema:
            type: boolean
          description: Chi co hieu luc khi gui kem JWT cua Admin
      responses:
        "200":
          description: Cau hinh cong thanh toan (codEnabled, vnpayEnabled, momoEnabled, enabledMethods, gateways[])
    put:
      tags: [Payments]
      summary: Cap nhat cau hinh cong thanh toan (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codEnabled: { type: boolean, example: true }
                codNote: { type: string }
                vnpayEnabled: { type: boolean, example: true }
                vnpayTmnCode: { type: string, example: PETHUB01 }
                vnpayEnvironment: { type: string, enum: [sandbox, production] }
                vnpayHashSecret: { type: string, description: Gui gia tri da che (co ky tu •) se giu nguyen khoa cu }
                momoEnabled: { type: boolean, example: true }
                momoPartnerCode: { type: string, example: MOMO }
                momoEnvironment: { type: string, enum: [sandbox, production] }
                momoAccessKey: { type: string }
                momoSecretKey: { type: string }
      responses:
        "200":
          description: Da luu cau hinh
        "400":
          description: Cau hinh khong hop le hoac tat toan bo cong thanh toan
        "403":
          description: Khong phai Admin

  /payments/vnpay/create:
    post:
      tags: [Payments]
      summary: Tao URL thanh toan VNPay (ky HMAC-SHA512) cho don hang online chon VNPay
      description: Khach vang lai can gui dung SDT dat hang; hoi vien gui JWT; Admin/Staff duoc tao cho moi don.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode]
              properties:
                orderCode: { type: string, example: PH123456 }
                phone: { type: string, example: "0988111222" }
                bankCode: { type: string, example: NCB }
                locale: { type: string, enum: [vn, en] }
                returnUrl: { type: string, description: Ghi de vnp_ReturnUrl (tuy chon) }
      responses:
        "201":
          description: Tra ve paymentUrl, txnRef, amount, expireAt (15 phut)
        "400":
          description: Don da huy / sai phuong thuc / cong dang tat
        "403":
          description: Khong dung chu don hang
        "404":
          description: Khong tim thay don hang
        "409":
          description: Don hang da duoc thanh toan

  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: Return URL - VNPay chuyen huong trinh duyet ve sau khi thanh toan
      description: Xac minh chu ky vnp_SecureHash va chot ket qua giao dich (idempotent). Neu cau hinh FRONTEND_URL se redirect ve Frontend kem ?payment=success|failed.
      parameters:
        - in: query
          name: vnp_TxnRef
          schema: { type: string }
        - in: query
          name: vnp_ResponseCode
          schema: { type: string, example: "00" }
        - in: query
          name: vnp_SecureHash
          schema: { type: string }
      responses:
        "200":
          description: Ket qua thanh toan (success, order, responseCode)
        "302":
          description: Chuyen huong ve FRONTEND_URL
        "400":
          description: Chu ky khong hop le hoac sai so tien
        "404":
          description: Khong tim thay giao dich

  /payments/vnpay/ipn:
    get:
      tags: [Payments]
      summary: IPN - VNPay goi server-to-server de xac nhan giao dich
      responses:
        "200":
          description: "Luon tra { RspCode, Message } - 00 thanh cong, 01 khong tim thay, 02 da xac nhan, 04 sai so tien, 97 sai chu ky, 99 loi khac"

  /payments/momo/create:
    post:
      tags: [Payments]
      summary: Tao yeu cau thanh toan MoMo (captureWallet, ky HMAC-SHA256)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderCode]
              properties:
                orderCode: { type: string, example: PH123456 }
                phone: { type: string, example: "0988111222" }
                redirectUrl: { type: string }
      responses:
        "201":
          description: Tra ve paymentUrl, qrCodeUrl, deeplink
        "400":
          description: Don khong hop le / so tien ngoai 1.000 - 50.000.000 VND
        "403":
          description: Khong dung chu don hang
        "409":
          description: Don hang da duoc thanh toan
        "502":
          description: Khong ket noi duoc hoac cong MoMo tu choi

  /payments/momo/return:
    get:
      tags: [Payments]
      summary: Redirect URL - MoMo chuyen huong trinh duyet ve sau khi thanh toan
      responses:
        "200":
          description: Ket qua thanh toan
        "302":
          description: Chuyen huong ve FRONTEND_URL
        "400":
          description: Chu ky khong hop le

  /payments/momo/ipn:
    post:
      tags: [Payments]
      summary: IPN - MoMo goi server-to-server de xac nhan giao dich
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerCode: { type: string }
                orderId: { type: string }
                requestId: { type: string }
                amount: { type: integer }
                orderInfo: { type: string }
                orderType: { type: string }
                transId: { type: integer }
                resultCode: { type: integer, example: 0 }
                message: { type: string }
                payType: { type: string }
                responseTime: { type: integer }
                extraData: { type: string }
                signature: { type: string }
      responses:
        "204":
          description: Da nhan IPN
        "400":
          description: Chu ky khong hop le

  /payments/summary:
    get:
      tags: [Payments]
      summary: Thong ke thu tien (da thu, con no, that bai, hoan tien, theo phuong thuc) - Admin/Staff
