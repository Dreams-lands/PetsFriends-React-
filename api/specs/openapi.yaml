            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [all, pending, shipping, completed, cancelled]
        - in: query
          name: source
          schema:
            type: string
            enum: [all, online, pos]
        - in: query
          name: paymentMethod
          schema:
            type: string
            enum: [all, vnpay, momo, cod]
        - in: query
          name: staffName
          schema:
            type: string
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
