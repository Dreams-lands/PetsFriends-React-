  /products:
    get:
      tags: [Products & Reviews]
      summary: Lay danh sach san pham (loc category, petType, subType, gia, promoOnly, featured, lowStock, search, sort)
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: petType
          schema:
            type: string
            enum: [all, dog, cat, both]
        - in: query
          name: subType
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: promoOnly
          schema:
            type: string
            enum: ["true", "false"]
        - in: query
          name: featured
          schema:
            type: string
            enum: ["true", "false"]
        - in: query
          name: lowStock
          schema:
            type: string
            enum: ["true", "false"]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [popular, price-asc, price-desc, rating, newest]
        - in: query
          name: includeInactive
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Thanh cong
    post:
      tags: [Products & Reviews]
      summary: Them san pham moi vao kho (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, priceNum]
              properties:
                id:
                  type: string
                  example: prod-new-01
                productId:
                  type: string
                  example: prod-new-01
                name:
                  type: string
                  example: Hat huu co ca hoi cho meo
                brand:
                  type: string
                  example: PETSFRIEND ORGANIC
                shortDesc:
                  type: string
                category:
                  type: string
                  example: food
                subType:
                  type: string
                petType:
                  type: string
                  enum: [dog, cat, both]
                  example: cat
                sizes:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                priceNum:
                  type: number
                  example: 250000
                originalPriceNum:
                  type: number
                  nullable: true
                  example: 300000
                stockCount:
                  type: integer
                  example: 30
                image:
                  type: string
                  example: /images/prod-ceramic-bowl.jpg
                isFeatured:
                  type: boolean
                  example: false
