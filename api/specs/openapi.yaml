openapi: 3.0.3
info:
  title: PetsFriend (QLThuCung) RESTful API
  version: 2.0.0
  description: He thong RESTful API ket noi SQL Server va React cho du an Cua hang & Spa Thu cung PetsFriend.

servers:
  - url: http://localhost:5000/api
    description: Local Backend Server

tags:
  - name: System
    description: Kiem tra he thong va ket noi CSDL
  - name: Auth & Users
    description: Dang nhap, dang ky, JWT, phan quyen RBAC, ho so, so dia chi, yeu thich va nhan su
  - name: Products & Reviews
    description: Danh muc, san pham, ton kho, upload anh va danh gia san pham
  - name: Orders & POS
    description: Don hang online, ban tai quay POS, quan ly ton kho don hang va thong ke doanh thu
  - name: Spa & Contact
    description: Goi dich vu Spa, dat lich hen, tra cuu/huy lich va tin nhan lien he
  - name: Payments
    description: Cau hinh cong thanh toan, VNPay (HMAC-SHA512), MoMo (HMAC-SHA256), xac nhan thu tien, hoan tien va lich su giao dich

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhap JWT token nhan duoc tu POST /auth/login hoac POST /auth/register

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Du lieu gui len khong hop le.

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        username:
          type: string
          nullable: true
          example: admin
        name:
          type: string
          example: Trinh Anh Khoa
        fullName:
          type: string
          example: Trinh Anh Khoa
        email:
          type: string
          example: admin@pethub.vn
        phone:
          type: string
          example: "0909123456"
        role:
          type: string
          enum: [customer, staff, admin]
          example: customer
        gender:
          type: string
          enum: [Nam, Nu, Khac]
          example: Nam
        status:
          type: string
          enum: [active, inactive, banned]
          example: active
        createdAt:
          type: string
          format: date-time

    AddressRecord:
      type: object
      properties:
        id:
          type: string
          example: "1"
        addressId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 3
        label:
          type: string
          example: Nha rieng
        recipient:
          type: string
          example: Trinh Anh Khoa
        phone:
          type: string
          example: "0909123456"
        address:
          type: string
          example: 128 Nguyen Hue, Quan 1, TP.HCM
        isDefault:
          type: boolean
          example: true

    StaffPermissions:
      type: object
      properties:
        ordersManage:
          type: boolean
          example: true
        ordersInvoices:
          type: boolean
          example: true
        pos:
          type: boolean
          example: true
        appointments:
          type: boolean
          example: true
        inventoryView:
          type: boolean
          example: true
        inventoryEdit:
          type: boolean
          example: false
        analytics:
          type: boolean
          example: false
        settings:
          type: boolean
          example: false

    Category:
      type: object
      properties:
        id:
          type: string
          example: food
        categoryCode:
          type: string
          example: food
        label:
          type: string
          example: Dinh duong & Pate
        name:
          type: string
          example: Dinh duong & Pate
        productCount:
          type: integer
          example: 2

    ProductReview:
      type: object
      properties:
        id:
          type: string
          example: rev-1
        reviewId:
          type: integer
          example: 1
        productId:
          type: string
          example: prod-rc-mini
        userId:
          type: integer
          nullable: true
          example: 3
        author:
          type: string
          example: Minh Thu
        petTag:
          type: string
          example: Nuoi Poodle
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        date:
          type: string
          example: "18/11/2026"
        verified:
          type: boolean
          example: true
        comment:
          type: string
          example: Hat rat thom, be an ngon mieng.

    ProductItem:
      type: object
      properties:
        id:
          type: string
          example: prod-rc-mini
        productId:
          type: string
          example: prod-rc-mini
        brand:
          type: string
          example: ROYAL CANIN
        name:
          type: string
          example: Hat dinh duong cho cho giong nho Mini Adult
        shortDesc:
          type: string
          example: Ho tro tieu hoa va long muot.
        category:
          type: string
          example: food
        subType:
          type: string
          example: Dinh duong & Hat kho
        petType:
          type: string
          enum: [dog, cat, both]
          example: dog
        sizes:
          type: array
          items:
            type: string
          example: ["2 kg", "4 kg", "8 kg"]
        priceNum:
          type: number
          example: 389000
        price:
          type: string
          example: "389.000₫"
        originalPriceNum:
          type: number
          nullable: true
          example: 489000
        originalPrice:
          type: string
          nullable: true
          example: "489.000₫"
        image:
          type: string
          example: /images/prod-chicken-pate.jpg
        stockCount:
          type: integer
          example: 22
        isFeatured:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ProductReview"

    OrderItem:
      type: object
      properties:
        id:
          type: string
          example: prod-rc-mini
        orderItemId:
          type: integer
          example: 1
        productId:
          type: string
          nullable: true
          example: prod-rc-mini
        name:
          type: string
          example: Hat dinh duong Mini Adult
        image:
          type: string
          example: /images/prod-chicken-pate.jpg
        price:
          type: number
          example: 389000
        quantity:
          type: integer
          example: 1
        variant:
          type: string
          example: "2 kg"

    Order:
      type: object
      properties:
        id:
          type: string
          example: PH261116
        orderId:
          type: integer
          example: 1
        orderCode:
          type: string
          example: PH261116
        userId:
          type: integer
          nullable: true
          example: null
        isGuest:
          type: boolean
          example: true
        status:
          type: string
          enum: [pending, shipping, completed, cancelled]
          example: pending
        orderSource:
          type: string
          enum: [online, pos]
          example: online
        totalAmount:
          type: number
          example: 389000
        deliveryMethod:
          type: string
          enum: [delivery, pickup]
          example: delivery
        shippingAddress:
          type: string
          example: 128 Nguyen Trai, Quan 1, TP.HCM
        paymentMethodCode:
          type: string
          enum: [vnpay, momo, cod]
          example: cod
        customerName:
          type: string
          example: Ho Minh Tuan
        customerPhone:
          type: string
          example: "0907345112"
        staffName:
          type: string
          nullable: true
          example: Ha Le
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    SpaPackage:
      type: object
      properties:
        id:
          type: string
          example: pkg-3
        packageId:
          type: string
          example: pkg-3
        name:
          type: string
          example: Cham soc Toan dien 7 Buoc
        desc:
          type: string
          example: Tron goi tam, massage, cat tia, cat mong.
        description:
          type: string
          example: Tron goi tam, massage, cat tia, cat mong.
        price:
          type: number
          example: 390000
        priceStr:
          type: string
          example: "390.000₫"
        duration:
          type: string
          example: 90 phut
        isPopular:
          type: boolean
          example: true

    ServiceBooking:
      type: object
      properties:
        id:
          type: string
          example: BK261116
        bookingId:
          type: integer
          example: 1
        bookingCode:
          type: string
          example: BK261116
        userId:
          type: integer
          nullable: true
        packageId:
          type: string
          nullable: true
          example: pkg-1
        serviceName:
          type: string
          example: Tam thao moc & Thu gian
        petName:
          type: string
          example: Coco (Pomeranian)
        date:
          type: string
          example: "2026-11-18"
        timeSlot:
          type: string
          example: 09:00 Sang
        price:
          type: number
          example: 180000
        status:
          type: string
          enum: [upcoming, completed, cancelled]
          example: upcoming
        customerName:
          type: string
          example: Le Thao Vy
        customerPhone:
          type: string
          example: "0935678920"
        staffName:
          type: string
          nullable: true
          example: Linh Pham
        note:
          type: string
          nullable: true

    ContactMessage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        messageId:
          type: integer
          example: 1
        senderName:
          type: string
          example: Nguyen Minh Anh
        senderPhone:
          type: string
          example: "0901234567"
        topic:
          type: string
          example: Tu van san pham & dinh duong
        message:
          type: string
          example: Nho shop tu van hat cho Poodle 2 tuoi.
        status:
          type: string
          enum: [new, replied, closed]
          example: new
        createdAt:
          type: string
          format: date-time

paths:
  # ==========================================================================
  # SYSTEM
  # ==========================================================================
  /health:
    get:
      tags: [System]
      summary: Kiem tra trang thai ket noi API va SQL Server QLThuCung
      responses:
        "200":
          description: Ket noi he thong hoat dong tot
        "500":
          description: Loi ket noi CSDL

  # ==========================================================================
  # AUTH & USERS (29 Operations)
  # ==========================================================================
  /auth/login:
    post:
      tags: [Auth & Users]
      summary: Dang nhap bang Email, Username hoac SDT (tra ve JWT token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  example: admin@pethub.vn
                password:
                  type: string
                  example: Admin@123
      responses:
        "200":
          description: Dang nhap thanh cong
        "401":
          description: Sai thong tin dang nhap
        "403":
          description: Tai khoan bi khoa hoac tam ngung

  /auth/register:
    post:
      tags: [Auth & Users]
      summary: Dang ky tai khoan hoi vien moi (ma hoa mat khau bcrypt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                username:
                  type: string
                  example: minhanh99
                fullName:
                  type: string
                  example: Nguyen Minh Anh
                name:
                  type: string
                  example: Nguyen Minh Anh
                email:
                  type: string
                  example: minhanh@gmail.com
                phone:
                  type: string
                  example: "0901234567"
                password:
                  type: string
                  example: "123456"
                gender:
                  type: string
                  example: Nu
                address:
                  type: string
                  example: 128 Nguyen Hue, Quan 1, TP.HCM
      responses:
        "201":
          description: Tao tai khoan thanh cong
        "400":
          description: Thong tin khong hop le
        "409":
          description: Email, username hoac SDT da ton tai

  /auth/me:
    get:
      tags: [Auth & Users]
      summary: Lay ho so nguoi dung hien tai tu Bearer JWT token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thanh cong
        "401":
          description: Chua dang nhap hoac token khong hop le

  /auth/change-password:
    put:
      tags: [Auth & Users]
      summary: Doi mat khau cho tai khoan dang dang nhap
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  example: NewPass@123
      responses:
        "200":
          description: Doi mat khau thanh cong
        "400":
          description: Mat khau hien tai sai hoac mat khau moi ngan hon 6 ky tu
        "401":
          description: Chua dang nhap

  /users:
    get:
      tags: [Auth & Users]
      summary: Lay danh sach nguoi dung (ho tro loc search, role, status)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum: [customer, staff, admin]
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, banned]
      responses:
        "200":
          description: Thanh cong
    post:
      tags: [Auth & Users]
      summary: Tao nguoi dung moi boi Quan tri vien (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                username:
                  type: string
                  example: staff02
                fullName:
                  type: string
                  example: Tran Thu Ha
                name:
                  type: string
                  example: Tran Thu Ha
                email:
                  type: string
                  example: thuha@pethub.vn
                phone:
                  type: string
                  example: "0908111222"
                password:
                  type: string
                  example: PetsFriend@123
                role:
                  type: string
                  example: staff
                status:
                  type: string
                  example: active
                gender:
                  type: string
                  example: Nu
      responses:
        "201":
          description: Tao nguoi dung thanh cong
        "403":
          description: Khong co quyen Admin
        "409":
          description: Trung email hoac username

  /users/lookup-phone:
    get:
      tags: [Auth & Users]
      summary: Tra cuu nhanh hoi vien bang SDT tai quay POS
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: phone
          required: true
          schema:
            type: string
            example: "0909123456"
      responses:
        "200":
          description: Tim thay hoi vien
        "404":
          description: Khong tim thay hoi vien khop SDT

  /users/{id}:
    get:
      tags: [Auth & Users]
      summary: Lay thong tin chi tiet mot nguoi dung theo ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thanh cong
        "404":
          description: Khong tim thay nguoi dung
    put:
      tags: [Auth & Users]
      summary: Cap nhat toan bo hoac mot phan thong tin nguoi dung (Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                fullName:
                  type: string
                name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [customer, staff, admin]
                status:
                  type: string
                  enum: [active, inactive, banned]
                gender:
                  type: string
      responses:
        "200":
          description: Cap nhat thanh cong
        "400":
          description: Du lieu khong hop le hoac ha quyen Admin duy nhat
        "404":
          description: Khong tim thay nguoi dung
    delete:
      tags: [Auth & Users]
      summary: Xoa nguoi dung khoi he thong (Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Xoa thanh cong
        "400":
          description: Khong the tu xoa chinh minh hoac Admin cuoi cung
        "404":
          description: Khong tim thay nguoi dung

  /users/{id}/role:
    patch:
      tags: [Auth & Users]
      summary: Thay doi vai tro nguoi dung (customer, staff, admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [customer, staff, admin]
                  example: staff
      responses:
        "200":
          description: Cap nhat vai tro thanh cong

  /users/{id}/status:
    patch:
      tags: [Auth & Users]
      summary: Thay doi trang thai tai khoan (active, inactive, banned)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, banned]
                  example: active
      responses:
        "200":
          description: Cap nhat trang thai thanh cong

  /users/{id}/profile:
    put:
      tags: [Auth & Users]
      summary: Cap nhat ho so ca nhan (name, email, phone, gender)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Trinh Anh Khoa
                fullName:
                  type: string
                  example: Trinh Anh Khoa
                email:
                  type: string
                  example: khoa.trinh@pethub.vn
                phone:
                  type: string
                  example: "0909123456"
                gender:
                  type: string
                  example: Nam
      responses:
        "200":
          description: Cap nhat thanh cong
        "403":
          description: Khong co quyen sua ho so nguoi khac

  /users/{id}/password:
    put:
      tags: [Auth & Users]
      summary: Doi mat khau tai khoan theo ID nguoi dung
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Doi mat khau thanh cong
        "400":
          description: Mat khau hien tai khong chinh xac

  /user-addresses:
    get:
      tags: [Auth & Users]
      summary: Lay toan bo danh sach dia chi nhan hang tren he thong (Admin/Staff)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thanh cong

  /users/{userId}/addresses:
    get:
      tags: [Auth & Users]
      summary: Lay so dia chi nhan hang cua mot nguoi dung
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thanh cong
    post:
      tags: [Auth & Users]
      summary: Them dia chi nhan hang moi cho nguoi dung
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, phone, address]
              properties:
                label:
                  type: string
                  example: Nha rieng
                recipient:
                  type: string
                  example: Trinh Anh Khoa
                phone:
                  type: string
                  example: "0909123456"
                address:
                  type: string
                  example: 128 Nguyen Hue, Quan 1, TP.HCM
                isDefault:
                  type: boolean
                  example: true
      responses:
        "201":
          description: Da them dia chi
        "404":
          description: Khong tim thay nguoi dung

  /users/{userId}/addresses/{addressId}:
    put:
      tags: [Auth & Users]
      summary: Cap nhat dia chi nhan hang cua nguoi dung
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                recipient:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                isDefault:
                  type: boolean
      responses:
        "200":
          description: Cap nhat thanh cong
        "404":
          description: Khong tim thay dia chi
    delete:
      tags: [Auth & Users]
      summary: Xoa dia chi nhan hang (tu dong gan mac dinh cho dia chi con lai neu xoa dia chi mac dinh)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Xoa dia chi thanh cong
        "404":
          description: Khong tim thay dia chi

  /users/{userId}/addresses/{addressId}/default:
    patch:
      tags: [Auth & Users]
      summary: Dat mot dia chi lam dia chi nhan hang mac dinh
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: addressId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Da dat lam mac dinh
        "404":
          description: Khong tim thay dia chi

  /users/{userId}/wishlist:
    get:
      tags: [Auth & Users]
      summary: Lay danh sach san pham yeu thich cua nguoi dung
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thanh cong
    post:
      tags: [Auth & Users]
      summary: Them san pham vao danh sach yeu thich
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  example: prod-rc-mini
      responses:
        "201":
          description: Da them vao danh sach yeu thich
        "404":
          description: Khong tim thay nguoi dung hoac san pham

  /users/{userId}/wishlist/{productId}:
    delete:
      tags: [Auth & Users]
      summary: Xoa san pham khoi danh sach yeu thich
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: productId
          required: true
          schema:
            type: string
            example: prod-rc-mini
      responses:
        "200":
          description: Da xoa khoi danh sach yeu thich

  /staff-roster:
    get:
      tags: [Auth & Users]
