                customerPhone:
                  type: string
                  example: "0907345112"
                customerEmail:
                  type: string
                deliveryMethod:
                  type: string
                  enum: [delivery, pickup]
                  example: delivery
                shippingAddress:
                  type: string
                  example: 128 Nguyen Trai, Quan 1, TP.HCM
                paymentMethod:
                  type: string
                  enum: [vnpay, momo, cod]
                  example: vnpay
                orderSource:
                  type: string
                  enum: [online, pos]
                  example: online
                staffName:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required: [quantity]
                    properties:
                      productId:
                        type: string
                        example: prod-rc-mini
                      name:
                        type: string
                        example: Hat dinh duong Mini Adult
                      image:
                        type: string
